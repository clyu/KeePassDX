name: Android CI

on:
  push:
    # Only what goes into the APK.
    paths:
      - .github/workflows/android.yml
      - app/**
      - crypto/**
      - database/**
      - icon-pack/**
      - gradle/**
      - "*.gradle.kts"
      - gradle.properties
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      apk-name: ${{ steps.rename.outputs.apk-name }}
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle itself comes from the wrapper.
      - uses: gradle/actions/setup-gradle@v6

      # abiFilters is the one thing added to upstream's build files: app/build.gradle.kts packages
      # the native libraries of the ABIs it names, and of every ABI without it.
      #
      # android.injected.signing.* is how the project's own fastlane lane signs a release. CI signs
      # with a fixed key from repository secrets so every build can update the app already
      # installed on the device. Without that key the APK is signed with one made up on the spot,
      # so that it can still be installed.
      - name: Build release APK
        id: build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/signing.jks"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway key and cannot update a previously installed build."
            SIGNING_KEYSTORE_PASSWORD=throwaway
            SIGNING_KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$keystore" -storepass "$SIGNING_KEYSTORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Throwaway CI key"
          fi
          # libre is the flavor that upstream builds for F-Droid; free is the one for Google Play.
          ./gradlew :app:assembleLibreRelease \
            -PabiFilters=arm64-v8a \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$SIGNING_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEYSTORE_PASSWORD"

      # A merge from upstream that lost the abiFilters property in app/build.gradle.kts would still
      # build, only with every ABI in the APK.
      - name: Check that the APK is for arm64 only
        run: |
          set -euo pipefail
          abis="$(unzip -Z1 app/build/outputs/apk/libre/release/app-libre-release.apk \
            | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | paste -sd ' ' -)"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "::error::Expected native libraries for arm64-v8a only, found: ${abis:-none}"
            exit 1
          fi

      - name: Rename build outputs
        id: rename
        run: |
          # The versionName the APK was built with, as recorded by the Android Gradle plugin.
          version=$(jq -r '.elements[0].versionName // empty' app/build/outputs/apk/libre/release/output-metadata.json)
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build/outputs/apk/libre/release/output-metadata.json"
            exit 1
          fi
          apk_name="KeePassDX-$version-libre-arm64"
          mv app/build/outputs/apk/libre/release/app-libre-release.apk "app/build/outputs/apk/libre/release/$apk_name.apk"
          echo "apk-name=$apk_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename.outputs.apk-name }}
          path: app/build/outputs/apk/libre/release/${{ steps.rename.outputs.apk-name }}.apk
          if-no-files-found: error

  # Puts the APK on the Releases page as the "Latest Build" pre-release, so that it can be
  # downloaded without signing in, which workflow artifacts require. An APK signed with the
  # throwaway key could not update an installed build, so it is not published.
  publish-latest:
    if: github.ref == 'refs/heads/master' && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest

    # A run checks that no later run has published before it publishes its own build, which two
    # runs at once could both get past and leave two Latest Builds. Queue them instead.
    concurrency:
      group: publish-latest
      cancel-in-progress: false

    permissions:
      contents: write

    # As whom gh acts and on which repository: there is no checkout here for it to tell from.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: apk

      # Every build gets a release under a tag of its own instead of refreshing a fixed tag, which
      # keeps working if immutable releases are enabled: a published release then cannot have its
      # assets replaced, and a deleted release's tag name can never be used again. Without
      # --target the tag would go on the head of the default branch, which need not be this commit.
      #
      # Runs do not get here in the order they were started: a build can outlast the next one's,
      # and an old run can be run again. Such a run has nothing to publish, since the Latest Build
      # that is up is later than its own. The run number in the tag tells them apart.
      - name: Publish the Latest Build pre-release
        env:
          TAG: ci-${{ github.run_number }}
        run: |
          set -euo pipefail
          later_tags="$(gh release list --limit 100 --json tagName,name,isPrerelease \
            | jq -r --argjson run "$GITHUB_RUN_NUMBER" \
              '.[] | select(.name == "Latest Build" and .isPrerelease) | .tagName
                | select(ltrimstr("ci-") | tonumber > $run)')"
          if [ -n "$later_tags" ]; then
            echo "::notice::A later run has already published its build; not publishing this one."
            exit 0
          fi
          gh release create "$TAG" apk/*.apk \
            --target "$GITHUB_SHA" --prerelease --title "Latest Build" \
            --notes "Built from $GITHUB_SHA by [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      # Only once the new release is up, so that there is always one to download. Deleting a
      # release leaves its tag behind, hence --cleanup-tag.
      - name: Delete the Latest Build releases of earlier runs
        run: |
          set -euo pipefail
          old_tags="$(gh release list --limit 100 --json tagName,name,isPrerelease \
            | jq -r --argjson run "$GITHUB_RUN_NUMBER" \
              '.[] | select(.name == "Latest Build" and .isPrerelease) | .tagName
                | select(ltrimstr("ci-") | tonumber < $run)')"
          for old in $old_tags; do
            gh release delete "$old" --yes --cleanup-tag
          done
